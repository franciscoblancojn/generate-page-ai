# Publica una release al subir un tag X.Y.Z (npm run deploy -- patch|minor|major).
# FWUUpdate (wordpress_utils) consulta /releases/latest para saber si hay versión nueva: sin
# release, el tag solo no basta. El zip adjunto sirve para instalar a mano.
name: release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el tag coincide con index.php
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 '^Version:' index.php | sed 's/Version:[[:space:]]*//' | tr -d '\r')"
          echo "tag=$TAG index.php=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::El tag ($TAG) no coincide con Version de index.php ($VERSION)"; exit 1; }

      - name: Construir generate-page-ai.zip (carpeta generate-page-ai/ en la raíz)
        run: |
          mkdir -p /tmp/build/generate-page-ai
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '/scripts' \
            --exclude '/bin' --exclude '/.claude' --exclude '/.opencode' --exclude '/.rules' --exclude '/opencode.json' \
            --exclude '/package.json' --exclude '/composer.json' \
            --exclude '/AGENTS.md' --exclude '/CLAUDE.md' --exclude '/CONTEXT.md' \
            ./ /tmp/build/generate-page-ai/
          (cd /tmp/build && zip -rqX "$GITHUB_WORKSPACE/generate-page-ai.zip" generate-page-ai)

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" generate-page-ai.zip --title "$GITHUB_REF_NAME" --generate-notes
